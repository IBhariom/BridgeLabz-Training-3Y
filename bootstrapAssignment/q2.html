<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light text-dark">

    <header class="container text-center mt-4 mb-3">

        <h1 class="fw-bold">Hariom</h1>

        <p class="text-muted">
            Web Developer | Java Programmer | AI Enthusiast
        </p>

    </header>

    <section class="container text-center p-5">

        <img src="c:\Users\h2565\Pictures\official\hariomImage.jpeg"
             class="img-fluid rounded-circle mb-3"
             alt="Profile Image"
             width="150">

        <h2 class="fw-bold">Hello, I'm Hariom</h2>

        <p class="mt-3">
            I am a passionate developer interested in
            web development, programming and technology.
        </p>

        <!-- Buttons -->
        <div class="mt-4">

            <a href="mailto:contact@example.com"

            <a href="resume.pdf"
               class="btn btn-success">
                Download CV
            </a>

        </div>

    </section>

    <!-- Contact Form -->
    <section class="container p-5 bg-white mb-4">

        <h2 class="text-center fw-bold mb-4">
            Contact Me
        </h2>

        <form>

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control"
                       placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control"
                       placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4"
                          placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Send Message
            </button>

        </form>

    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">

        <p class="mb-0">
            © 2026 Hariom | All Rights Reserved
        </p>

    </footer>

</body>
