<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card {
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .card img {
            height: 200px;
            object-fit: cover;
        }
    </style>

</head>

<body class="bg-light">

    <div class="container text-center mt-4 mb-4">
        <h1 class="fw-bold">Our Products</h1>
        <p>Explore our latest collection</p>
    </div>

    <div class="container">

        <div class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm h-100">

                    <img src="https://placehold.co/300x200"
                         class="card-img-top" alt="Laptop">

                    <div class="card-body text-center">
                        <h5>Laptop</h5>
                        <p class="text-success fw-bold">₹55,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm h-100">

                    <img src="https://placehold.co/300x200"
                         class="card-img-top" alt="Mobile">

                    <div class="card-body text-center">
                        <h5>Smartphone</h5>
                        <p class="text-success fw-bold">₹25,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm h-100">

                    <img src="https://placehold.co/300x200"
                         class="card-img-top" alt="Headphones">

                    <div class="card-body text-center">
                        <h5>Headphones</h5>
                        <p class="text-success fw-bold">₹2,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm h-100">

                    <img src="https://placehold.co/300x200"
                         class="card-img-top" alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5>Smart Watch</h5>
                        <p class="text-success fw-bold">₹3,500</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        © 2026 My Store. All Rights Reserved.
    </footer>

</body>
</html>
