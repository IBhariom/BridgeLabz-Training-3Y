<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            .code-container{
                text-align:center;
                background-color:red;
                width:15px;
                margin:auto;
                padding:10px;
            }
            .body-container{
                text-align:center;
                background-color:lightgray;
                width:50%;
                margin:auto;
                padding:20px;
            }
    </style>
</head>
<body>
    <div class="body-container">
    <form>
        <div class="code-conatiner">
        <label for="Name">Name</label><br>
        <input id="Name" type="'text" placeholder="Enter Your Name"><br><br></div>
        <div>
        <label for="Email">Email</label><br>
        <input id="Email" type="text" placeholder="Enter Your Name"><br>
        </div>
        <div>
        <label for="pass">Password</label><br><br>
        <input id="pass" type="password" placeholder="Enter your password"><br>
        </div>
        <div>
        <label for="date">Date</label><br>
        <input id="date" type="date" placeholder="Enter Date"><br><br>
        </div>
        <div>
        <label>Skill</label>
        <select name="skill" >
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javaScript">JavaScript</option>
        </select><br>
        </div>
        <div>
        <section>
        <input id="html" type="checkbox">
        <label for="html">html</label>
        <input id="css" type="checkbox">
        <label id="css">css</label>
        </section>
        <br>
        </div>
        <div>

        <section>
            <label>Gender</label><br>
            <input type="radio" name="Gender">
            <label >Male</label>
            <input type="radio" name="Gender">
            <label>Female</label>
            <input type="radio" name="Gender">
            <label>Other</label>
        </section>
        <br>
        </div>
        <div>
        <input type="file" name="file"><br>
        <input type="range" max="3" min="0">
        <input type="submit"><br>
        <input type="reset"><br><br>
        <button type="submit">Submit</button>
        <br>
        <br>
        </div>
    </form>
</div>

</body>
</html>
