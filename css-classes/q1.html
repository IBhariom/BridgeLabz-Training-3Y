<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="q1style.css">
</head>
<body>

<h1>Pseudo-Classes Demo</h1>

<div class="container">

    <div class="box">
        <h3>:hover</h3>
        <p>Changes when mouse is over it.</p>
        <a href="#">Hover Me</a>
    </div>

    <div class="box">
        <h3>:focus</h3>
        <p>Changes when the button gets focus.</p>
        <button>Focus Me</button>
    </div>

    <div class="box">
        <h3>:active</h3>
        <p>Changes while clicking the button.</p>
        <button>Click Me</button>
    </div>

    <div class="box">
        <h3>:nth-child()</h3>
        <p>Changes an item based on its position.</p>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>

</div>

</body>
</html>
