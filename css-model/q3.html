<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="q3style.css">
</head>

<body>

    <header>
        <h2>Gradient Background Page</h2>
    </header>

    <main>

        <section class="linear">
            <h1>Linear Gradient</h1>
            <p>
                This section uses a linear gradient.
                The colors change gradually from one direction to another.
            </p>
        </section>

        <section class="radial">
            <h1>Radial Gradient</h1>
            <p>
                This section uses a radial gradient.
                The colors spread outward from a central point.
            </p>
        </section>

    </main>

    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
