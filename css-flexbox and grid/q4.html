<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="q4style.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>My Dashboard</h1>
        </header>

        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main>

            <div class="box box1">
                <h2>Total Users</h2>
                <p>1,250</p>
            </div>

            <div class="box box2">
                <h2>Projects</h2>
                <p>48</p>
            </div>

            <div class="box box3">
                <h2>Revenue</h2>
                <p>₹85,000</p>
            </div>

            <div class="box box4">
                <h2>Messages</h2>
                <p>125 New Messages</p>
            </div>

        </main>

    </div>

</body>
</html>
